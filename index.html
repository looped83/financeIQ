<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131210">
<meta name="color-scheme" content="dark">
<title>FinanceIQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f47a32'/%3E%3Cpath d='M9 22v-6M16 22V10M23 22v-10' stroke='%231a0f07' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<!-- Upload: plain markup so it paints before any script (no chart code is loaded here) -->
<div id="upload-screen" class="upload">
  <div class="upload-inner">
    <div class="brand">
      <span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 17v-5M12 17V7M18 17v-8"/></svg></span>
      FinanceIQ
    </div>
    <p class="upload-lead">Deine Finanzen auf einen Blick – lade den CSV-Export deiner Bank oder deines Brokers.</p>
    <label class="dropzone" id="upload-zone">
      <input type="file" id="file-input" accept=".csv,text/csv">
      <span class="dropzone-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></span>
      <span class="dropzone-title">CSV-Datei hochladen</span>
      <span class="dropzone-hint">Datei hier ablegen oder <strong>auswählen</strong></span>
      <span class="dropzone-hint">Trade Republic, Sparkasse, DKB &amp; mehr</span>
    </label>
    <ul class="upload-facts">
      <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Bleibt auf deinem Gerät</li>
      <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Cashflow, Ausgaben &amp; Dividenden</li>
      <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Prognose &amp; Vergleiche</li>
    </ul>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="page-header" id="page-header"></header>
    <main id="pages"></main>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Hauptnavigation"></nav>
  <div id="sheet"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
